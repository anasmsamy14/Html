<!Doctype html>
<html>

<head>
    <title>My Food Menu</title>
    <style>
        body {
            font-family: Arial;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #e65c00;
        }

        h1+p {
            background: #ffe0b2;
            padding: 10px 20px;
            border-radius: 8px;
            color: #bf360c;
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        ul > li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: #fff3e0;
            border-radius: 8px;
        }
        ul li:nth-child(3) {
            background: #ffe082;
            color: #e65c00;
        }
        .desc {
            color:#555;
            margin-top: 20px;
            font-size: 16px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
         .links {
            margin-top: 20px;
            margin-bottom: 4%;
            display: flex;
            flex-direction: column;
            align-items: center;
         }
        .link {
            margin-top: 20px;
        }
        a {
            text-decoration: none;
            color: #e65c00;
            font-size: 16px;
            margin: 0 10px;
            border: 2px solid #e65c00;
            padding: 6px 12px;
            border-radius: 6px;
        }
        a:hover {
            background: #e65c00;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>Welcome to My Food Menu</h1>
    <p>Here you can find a variety of delicious dishes to choose from. Enjoy your meal</p>
    <ul>
        <li>Burger</li>
        <li>Pizza - chef's special</li>
        <li>Pasta</li>
        <li>Salad</li>
        <li>Ice Cream</li>
    </ul>
    <p class='desc'>Every dish on the menu is packed with flavor!</p>

    <div class='links'>
        <a href='https://www.dominos.com.eg/menu'>Domino's Pizza</a><br>
        <a href='https://www.mcdonalds.eg/eat/menu/page/full-menu'>McDonald's</a><br>
        <a href='https://www.kfc.com/menu'>KFC</a><br>
    </div>
    <div class='link'>
        <a href='#'>order now</a>
        <a href='#'>contact us</a>
    </div>
</body>

</html>
