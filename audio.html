<!DOCTYPE html>
<html>

<head>
    <title>My Media Adventure</title>
</head>

<body>

    <h1>My Media Adventure</h1>

    <h2>My Favorite Image</h2>
    <img src="https://picsum.photos/400/250" width="400">

    <h2>My Favorite Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h2>My Favorite Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>My Favorite Website</h2>
    <iframe src="https://www.wikipedia.org" width="500" height="300"></iframe>

</body>

</html>
